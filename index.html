<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sets">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f6f5f2">
<title>Sets & Notes</title>
<link rel="stylesheet" href="app.css?v=25">
</head>
<body>
<!-- ========== Accueil : onglets Sets / Chants / Notes ========== -->
<section id="list" class="view">
  <div class="top"><div><h1 id="h1">Sets</h1><p><span id="count"></span> <span id="sync"></span> <span class="ver">· v25</span></p><button id="space" class="space hidden" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.9.4 5 2.8 5 5.8"/></svg><span></span><i>▾</i></button></div><button class="cloud" id="cloud" aria-label="Réglages et synchronisation"><svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5z"/></svg></button></div>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Rechercher"></label>
  <div id="grid" class="grid"></div>
  <button class="fab" id="new" aria-label="Nouveau"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabs">
    <button data-tab="sets"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Sets</button>
    <button data-tab="songs"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Chants</button>
    <button data-tab="notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>Notes</button>
  </nav>
</section>

<!-- ========== Note libre ========== -->
<section id="editor" class="view hidden">
  <div class="bar">
    <button class="back" id="back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Notes</button>
    <span class="sp"></span>
    <button class="ib" id="del" aria-label="Supprimer la note"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
  <div class="scroller">
    <input id="title" placeholder="Titre" autocomplete="off">
    <div id="date"></div>
    <div id="body" contenteditable="true"></div>
  </div>
  <div class="tools">
    <button class="ib" data-cmd="bold"><b>B</b></button>
    <button class="ib" data-cmd="italic"><i>I</i></button>
    <button class="ib" data-cmd="underline"><u>U</u></button>
    <button class="ib" data-cmd="list" aria-label="Liste"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
    <button class="ib" data-cmd="check" aria-label="Case à cocher"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></button>
    <button class="ib" data-cmd="struct" aria-label="Structure"><svg viewBox="0 0 24 24"><path d="M5 4v16M9 7h10M9 12h7M9 17h10"/></svg></button>
    <button class="ib mic" id="mic" aria-label="Enregistrer"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
</section>

<!-- ========== Fiche d'un chant (bibliothèque) ========== -->
<section id="song" class="view hidden">
  <div class="bar">
    <button class="back" data-back><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span>Chants</span></button>
    <span class="sp"></span>
    <button class="ib edit-only" id="s-del" aria-label="Supprimer le chant"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
  <div class="scroller form">
    <input id="s-title" class="big" placeholder="Titre du chant" autocomplete="off">
    <input id="s-artist" class="sub" placeholder="Auteur / artiste" autocomplete="off">
    <p id="s-mod" class="info mod"></p>
    <div class="fields">
      <label>Tonalité<button id="s-key" class="fld" type="button"></button></label>
      <label>Tempo<input id="s-bpm" class="fld" inputmode="numeric" placeholder="BPM" autocomplete="off"></label>
      <label>Mesure<select id="s-sig" class="fld"><option value="">—</option><option>4/4</option><option>3/4</option><option>6/8</option><option>12/8</option><option>2/4</option></select></label>
      <label>Durée<input id="s-dur" class="fld" inputmode="numeric" placeholder="4:30" autocomplete="off"></label>
    </div>
    <button id="s-metro" class="metrobtn" type="button"></button>
    <label class="lbl">Style / feel<input id="s-style" class="fld" list="styles" placeholder="Gospel, ballade, pop…" autocomplete="off"></label>
    <h3>Structure</h3>
    <div id="s-struct"></div>
    <h3>Versions YouTube</h3>
    <div id="s-vids" class="vids"></div>
    <div class="vadd edit-only"><input id="s-vurl" class="fld" placeholder="Coller un lien YouTube" inputmode="url" autocomplete="off"><input id="s-vlabel" class="fld" placeholder="Nom (ex. Live 2019)" autocomplete="off"><button id="s-vadd" type="button">Ajouter</button></div>
    <h3>Autres liens</h3>
    <textarea id="s-links" class="fld" rows="2" placeholder="Un lien par ligne (Spotify, partition…)"></textarea>
    <div id="s-linkview" class="links"></div>
    <h3>Notes</h3>
    <textarea id="s-notes" class="fld" rows="3" placeholder="Ex. le pont monte en intensité"></textarea>
    <h3>Enregistrements de référence</h3>
    <div id="s-recs" class="recs"></div>
    <div class="recrow"><button class="recbtn" id="s-rec" type="button"><span class="rdot"></span>Enregistrer</button><button class="recbtn imp" id="s-imp" type="button">Importer un fichier audio</button></div>
    <input id="s-file" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" hidden>
    <div id="s-mine" class="mine hidden"><h3>Mes notes perso <small>visibles par moi seul</small></h3><textarea id="s-pnote" class="fld" rows="2" placeholder="Ex. slap sur le pont, capo 2…"></textarea></div>
    <h3>Utilisé dans</h3>
    <div id="s-used" class="used"></div>
  </div>
</section>

<!-- ========== Un set ========== -->
<section id="set" class="view hidden">
  <div class="bar">
    <button class="back" data-back><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span>Sets</span></button>
    <span class="sp"></span>
    <button class="ib edit-only" id="set-dup" aria-label="Dupliquer le set"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
    <button class="ib edit-only" id="set-del" aria-label="Supprimer le set"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
  <div class="scroller form">
    <input id="set-name" class="big" placeholder="Nom (ex. Culte du dimanche)" autocomplete="off">
    <div class="fields two">
      <label>Date<input id="set-date" class="fld" type="date"></label>
    </div>
    <p id="set-sum" class="info"></p>
    <p id="set-mod" class="info mod"></p>
    <div class="setact">
      <button id="set-play" class="ok" type="button"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Mode scène</button>
      <button id="set-yt" type="button"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="7" rx="1.5"/><rect x="16.5" y="14" width="4.5" height="7" rx="1.5"/></svg>Écouter</button>
      <button id="set-share" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>Partager</button>
    </div>
    <div id="set-items" class="items"></div>
    <button class="addbtn edit-only" id="set-add" type="button">+ Ajouter un chant</button>
    <h3>Notes du set</h3>
    <textarea id="set-notes" class="fld" rows="3" placeholder="Infos générales, horaires, consignes…"></textarea>
  </div>
</section>

<!-- ========== Un chant dans un set (réglages du jour) ========== -->
<section id="item" class="view hidden">
  <div class="bar">
    <button class="back" data-back><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span>Set</span></button>
    <span class="sp"></span>
    <button class="ib edit-only" id="it-del" aria-label="Retirer du set"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
  <div class="scroller form">
    <div class="ithead"><span id="it-num" class="num"></span><div><h2 id="it-title"></h2><button id="it-open" class="link" type="button">Voir la fiche du chant ›</button></div></div>
    <p id="it-info" class="info"></p>
    <button id="it-metro" class="metrobtn" type="button"></button>
    <p id="it-mod" class="info mod"></p>
    <div class="fields two">
      <label>Tonalité du jour<button id="it-key" class="fld" type="button"></button></label>
      <label>Lead<input id="it-lead" class="fld" placeholder="Qui chante ?" autocomplete="off"></label>
    </div>
    <div class="fields two">
      <label>Version YouTube<select id="it-video" class="fld"></select></label>
      <label>À écouter pour ce set<select id="it-listen" class="fld"><option value="">★ Officiel en priorité</option><option value="rep">Enregistrement de répétition</option><option value="yt">YouTube</option></select></label>
    </div>
    <h3>Structure du jour <button id="it-reset" class="link small edit-only" type="button">Rétablir celle du chant</button></h3>
    <div id="it-struct"></div>
    <h3>Note / transition</h3>
    <textarea id="it-note" class="fld" rows="2" placeholder="Ex. enchaîner sans pause, piano seul pendant la prière…"></textarea>
    <h3>Enregistrements</h3>
    <div id="it-recs" class="recs"></div>
    <div class="recrow"><button class="recbtn" id="it-rec" type="button"><span class="rdot"></span>Enregistrer</button><button class="recbtn imp" id="it-imp" type="button">Importer un fichier audio</button></div>
    <input id="it-file" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" hidden>
    <div id="it-mine" class="mine hidden"><h3>Mes notes perso <small>visibles par moi seul</small></h3><textarea id="it-pnote" class="fld" rows="2" placeholder="Ex. attention au break avant le refrain…"></textarea></div>
  </div>
</section>

<!-- ========== Mode scène ========== -->
<section id="stage" class="view hidden">
  <div class="stbar">
    <button class="stq" data-back type="button"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg><span>Quitter</span></button>
    <div class="stset"><b id="st-set"></b><span id="st-pos"></span></div>
    <button id="st-metro" class="stbtn hidden" type="button"></button>
    <button id="st-lead" class="stbtn hidden" type="button">Diriger</button>
    <button id="st-follow" class="stbtn hidden" type="button">Suivre</button>
  </div>
  <p id="st-leader" class="stleader hidden"></p>
  <div class="stmain">
    <h1 id="st-title"></h1>
    <div class="stkeyrow"><span id="st-key" class="stkey"></span><span id="st-orig" class="storig"></span></div>
    <p id="st-meta" class="stmeta"></p>
    <div id="st-beat" class="stbeat"></div>
    <div id="st-pills" class="stpills"></div>
    <p id="st-lead-name" class="stline"></p>
    <p id="st-note" class="stline stnote"></p>
    <p id="st-pnote" class="stline stpn"></p>
  </div>
  <div class="stnext"><button id="st-prev" type="button" aria-label="Chant précédent">‹</button><span id="st-next"></span><button id="st-nextb" type="button" aria-label="Chant suivant">›</button></div>
</section>

<!-- Version imprimable d'un set (PDF) -->
<div id="print"></div>

<datalist id="styles"></datalist>

<div id="recbar" class="recbar hidden"><span class="dot"></span><span class="tm" id="tm">0:00</span><button class="pause" id="pause">Pause</button><button id="stop">Arrêter</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vendor/diff_match_patch.js?v=1"></script>
<script src="app.js?v=25"></script>
</body>
</html>
